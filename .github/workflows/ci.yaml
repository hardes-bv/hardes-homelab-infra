---
name: Test config files
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install mise"
        uses: "jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d" # v4.2.0
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.3.7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # only saving the cache in the prerequisites job
          cache_save: true
      - name: "Test config files"
        run: make test

  diff:
    if: github.event_name == 'pull_request'
    needs:
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - desk8s
          - rack8s
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install mise"
        uses: "jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d" # v4.2.0
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.3.7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # only saving the cache in the prerequisites job
          cache_save: true
      - run: flate diff all --path kubernetes/clusters/${{ matrix.site }} --base ${{ github.event.repository.default_branch }} --supply ./test/${{ matrix.site }}/flux-runtime-info.yaml -o github > flate-diff.txt

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # the token of pull requests from forks is read-only
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: flate-${{ matrix.site }}
          recreate: true
          path: flate-diff.txt
          message: |
            ### Flate diff: ${{ matrix.site }}

            Rendered changes against `${{ github.base_ref }}` (empty = no changes).

            ```diff
            {{{content}}}
            ```
