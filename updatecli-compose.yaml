name: "UpdateCLI Policies to apply"
policies:
  - name: Upgrade updatecli
    id: upgrade-updatecli
    config:
      - updatecli/updatecli.d/upgrade-updatecli.yaml
    values:
      - updatecli/values.d/scm.yaml

  - name: Test upgrade cert-manager
    id: test-upgrade-cert-manager
    config:
      - updatecli/updatecli.d/test-upgrade.yaml
    values:
      - updatecli/values.d/cert-manager.yaml
      - updatecli/values.d/scm.yaml

  - name: Test upgrade cert-manager-scaleway-webhook
    id: test-upgrade-cert-manager-scaleway-webhook
    config:
      - updatecli/updatecli.d/test-upgrade.yaml
    values:
      - updatecli/values.d/cert-manager-scaleway-webhook.yaml
      - updatecli/values.d/scm.yaml

  - name: Test upgrade cilium
    id: test-upgrade-cilium
    config:
      - updatecli/updatecli.d/test-upgrade.yaml
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/cilium.yaml

  - name: Test upgrade external-dns
    id: test-upgrade-external-dns
    config:
      - updatecli/updatecli.d/test-upgrade.yaml
    values:
      - updatecli/values.d/external-dns.yaml
      - updatecli/values.d/scm.yaml

  - name: Test upgrade external-dns-unifi
