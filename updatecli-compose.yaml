      - updatecli/values.d/external-dns-unifi.yaml
      - updatecli/values.d/scm.yaml

  - name: Test upgrade kubernetes
    id: test-upgrade-kubernetes
    config:
      - updatecli/updatecli.d/test-upgrade-kubernetes.yaml
    values:
      - updatecli/values.d/scm.yaml

  - name: Test upgrade talos
    id: test-upgrade-talos
    config:
      - updatecli/updatecli.d/test-upgrade-talos.yaml
    values:
      - updatecli/values.d/scm.yaml

  - name: Test upgrade tuppr
    id: test-upgrade-tuppr
    config:
      - updatecli/updatecli.d/test-upgrade-tuppr.yaml
    values:
      - updatecli/values.d/scm.yaml

  - name: Promote cert-manager version
    id: promote-cert-manager
    config:
      - updatecli/updatecli.d/promote-version.yaml
    values:
      - updatecli/values.d/cert-manager.yaml
      - updatecli/values.d/scm.yaml

  - name: Promote cert-manager-scaleway-webhook version
