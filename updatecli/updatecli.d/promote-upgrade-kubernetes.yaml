name: "Promote upgrade the Kubernetes version"
pipelineid: "rack8s-upgrade-kubernetes"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  testedVersion:
    name: Get tested Kubernetes version from `desk8s`
    kind: yaml
    spec:
      file: kubernetes/infrastructure/desk8s/system-upgrade/tuppr-upgrade-inputs.yaml
      key: "$.spec.defaultValues.kubernetes.tag"
  testedTrimmedVersion:
    name: Get tested Kubernetes version from `desk8s`
    kind: yaml
    spec:
      file: kubernetes/infrastructure/desk8s/system-upgrade/tuppr-upgrade-inputs.yaml
      key: "$.spec.defaultValues.kubernetes.tag"
    transformers:
      - trimprefix: "v"

targets:
  kubernetesUpgrade:
    name: 'deps: rack8s - update Kubernetes version to {{ source "testedVersion" }} in `ResourceSetInputProvider` resource'
    kind: yaml
    scmid: default
    sourceid: testedVersion
    spec:
      file: kubernetes/infrastructure/rack8s/system-upgrade/tuppr-upgrade-inputs.yaml
      key: "$.spec.defaultValues.kubernetes.tag"
  readme:
    name: 'deps: rack8s - update Kubernetes version to {{ source "testedTrimmedVersion" }} in cluster README'
    kind: file
    scmid: default
    sourceid: testedTrimmedVersion
    spec:
      files:
        - talos/rack8s/README.adoc
      matchpattern: 'upgrade-k8s --to \d*\.\d*\.\d*'
      replacepattern: 'upgrade-k8s --to {{ source "testedTrimmedVersion" }}'
  clusterConfig:
    name: 'deps: rack8s - update Kubernetes version to {{ source "testedVersion" }} in Talos cluster configuration'
    kind: file
    scmid: default
    sourceid: testedVersion
    spec:
      files:
        - talos/rack8s/controlplane.yaml
        - talos/rack8s/worker.yaml
      matchpattern: 'image: (ghcr\.io/siderolabs|registry\.k8s\.io)/(k[^:\s]+):v\d+\.\d+\.\d+'
      replacepattern: 'image: $1/$2:{{ source "testedVersion" }}'

actions:
  default:
    title: 'deps: rack8s - update Kubernetes version to {{ source "testedVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
