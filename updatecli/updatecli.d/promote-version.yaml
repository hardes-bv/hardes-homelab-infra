name: "Promote the {{ .package.name }} version"
pipelineid: "rack8s-promote-{{ .package.name }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  testedVersion:
    name: Get tested {{ .package.name }} version from `desk8s`
    kind: yaml
    spec:
      file: kubernetes/infrastructure/desk8s/kube-system/cilium-inputs.yaml
      key: '$.spec.defaultValues.tag'

targets:
  ciliumUpgrade:
    name: 'deps: rack8s - update {{ .package.name }} version to {{ source "testedVersion" }}'
    kind: yaml
    scmid: default
    spec:
      file: kubernetes/infrastructure/rack8s/kube-system/cilium-inputs.yaml
      key: '$.spec.defaultValues.tag'

actions:
  default:
    title: 'deps: rack8s - update {{ .package.name }} version to {{ source "testedVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
