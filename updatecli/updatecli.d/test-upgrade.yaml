name: "Test upgrade the {{ .package.name }} version"
pipelineid: "desk8s-upgrade-{{ .package.name }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  latestVersion:
    name: Get latest {{ .package.name }} release
#{{- if .from.githubrelease }}
    kind: githubrelease
    spec:
      owner: "{{ .from.githubrelease.owner }}"
      repository: "{{ .from.githubrelease.repository }}"
      typefilter:
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
#{{- end }}
#{{- if .from.helmchart }}
    kind: helmchart
    spec:
      url: {{ .from.helmchart.url }}
      name: {{ .from.helmchart.name }}
#{{- end }}
#{{- if .from.dockerimage }}
    kind: dockerimage
    spec:
      image: {{ .from.dockerimage.image }}
      versionfilter:
        kind: semver
#{{- end }}
#{{- if .from.stripVersionPrefix }}
    transformers:
      - trimprefix: "v"
#{{- end}}

targets:
  fluxPatch:
    name: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }}'
    kind: yaml
    scmid: default
    spec:
      file: kubernetes/infrastructure/desk8s/{{ .to.yaml.file }}
#{{- $key := index .to.yaml "key" }}
      key: '{{- if $key }}{{ $key }}{{ else }}$.spec.defaultValues.tag{{ end }}'
#{{- if  eq .package.name "cilium" }}
  bootstrap:
    name: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }}'
    kind: file
    scmid: default
    sourceid: latestVersion
    spec:
      files:
        - bootstrap/cilium/README.md
      matchpattern: '--version \d*\.\d*\.\d*'
      replacepattern: '--version {{ source "latestVersion" }}'
#{{- end }}

actions:
  default:
    title: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
