name: "Test upgrade of External DNS"
pipelineid: "desk8s-upgrade-external-dns"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  latestVersion:
    name: "Get latest `external-dns` release"
    kind: dockerimage
    spec:
      image: ghcr.io/home-operations/charts-mirror/external-dns
      versionfilter:
        kind: semver

targets:
  fluxPatch:
    name: 'docs: desk8s - update `external-dns` version to {{ source "latestVersion" }} in `ResourceSetInputProvider` resource'
    kind: yaml
    scmid: default
    spec:
      file: kubernetes/infrastructure/desk8s/network/unifi-dns-inputs.yaml
      key: "$.spec.defaultValues.externalDns.tag"

actions:
  default:
    title: 'deps: desk8s - update `external-dns` operator version to {{ source "latestVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
