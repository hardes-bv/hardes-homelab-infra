name: "Test upgrade the Kubernetes version"
pipelineid: "desk8s-upgrade-kubernetes"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  latestVersion:
    name: Get latest Kubernetes release
    kind: githubrelease
    spec:
      owner: "kubernetes"
      repository: "kubernetes"
      typefilter:
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
  latestTrimmedVersion:
    name: Get latest Kubernetes release
    kind: githubrelease
    spec:
      owner: "kubernetes"
      repository: "kubernetes"
      typefilter:
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
    transformers:
      - trimprefix: "v"

targets:
  fluxPatch:
    name: 'deps: desk8s - update Kubernetes version to {{ source "latestVersion" }} in `ResourceSetInputProvider` resource'
    kind: yaml
    scmid: default
    sourceid: latestVersion
    spec:
      file: kubernetes/infrastructure/desk8s/system-upgrade/tuppr-upgrade-inputs.yaml
      key: "$.spec.defaultValues.kubernetes.tag"
  readme:
    name: 'deps: desk8s - update Kubernetes version to {{ source "latestTrimmedVersion" }} in cluster README'
    kind: file
    scmid: default
    sourceid: latestTrimmedVersion
    spec:
      files:
        - talos/desk8s/README.adoc
      matchpattern: 'upgrade-k8s --to \d*\.\d*\.\d*'
      replacepattern: 'upgrade-k8s --to {{ source "latestTrimmedVersion" }}'
  clusterConfig:
    name: 'deps: desk8s - update Kubernetes version to {{ source "latestVersion" }} in Talos cluster configuration'
    kind: file
    scmid: default
    sourceid: latestVersion
    spec:
      files:
        - talos/desk8s/controlplane.yaml
        - talos/desk8s/worker.yaml
      matchpattern: 'image: (ghcr\.io/siderolabs|registry\.k8s\.io)/(k[^:\s]+):v\d+\.\d+\.\d+'
      replacepattern: 'image: $1/$2:{{ source "latestVersion" }}'

actions:
  default:
    title: 'deps: desk8s - update Kubernetes version to {{ source "latestVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
