name: "Test upgrade the {{ .package.name }} version"
pipelineid: "desk8s-upgrade-{{ .package.name }}"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  latestVersion:
    name: Get latest {{ .package.name }} release
    kind: githubrelease
    spec:
      owner: "{{ .package.name }}"
      repository: "{{ .package.owner }}"
      typefilter:
        draft: false
        prerelease: false
      versionfilter:
        kind: semver
#{{- if .package.stripVersionPrefix }}
    transformers:
      - trimprefix: "v"
#{{- end}}

targets:
  fluxPatch:
    name: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }}'
    kind: yaml
    scmid: default
    spec:
      file: kubernetes/infrastructure/desk8s/kube-system/cilium-inputs.yaml
      key: '$.spec.defaultValues.tag'
  bootstrap:
    name: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }} in boostrap README'
    kind: file
    scmid: default
    sourceid: latestVersion
    spec:
      files:
        - bootstrap/cilium/README.md
      matchpattern: '--version \d*\.\d*\.\d*'
      replacepattern: '--version {{ source "latestVersion" }}'

actions:
  default:
    title: 'deps: desk8s - update {{ .package.name }} version to {{ source "latestVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
