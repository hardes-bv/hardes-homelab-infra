name: "Promote upgrade the cert-manager version"
pipelineid: "rack8s-upgrade-cert-manager"

scms:
  default:
    kind: github
    spec:
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      branch: "{{ .scm.branch }}"

sources:
  testedVersion:
    name: Get tested cert-manager version from `desk8s`
    kind: yaml
    spec:
      file: kubernetes/infrastructure/desk8s/cert-manager/cert-manager-inputs.yaml
      key: "$.spec.defaultValues.tag"

targets:
  ciliumUpgrade:
    name: 'deps: rack8s - update cert-manager version to {{ source "testedVersion" }} in `ResourceSetInputProvider` resource'
    kind: yaml
    scmid: default
    spec:
      file: kubernetes/infrastructure/rack8s/cert-manager/cert-manager-inputs.yaml
      key: '$.spec.defaultValues.tag'

actions:
  default:
    title: 'deps: rack8s - update cert-manager version to {{ source "testedVersion" }}'
    kind: github/pullrequest
    spec:
      labels:
        - chore
        - skip-changelog
    scmid: default
