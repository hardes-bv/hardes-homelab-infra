---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  components:
  - ../components/desk8s
  targetNamespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/desk8s
  prune: true
  wait: true
  postBuild:
    substituteStrategy: Always
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
