---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  artifacts:
    ### infrastructure
    # external-secrets + onepassword-sdk-hardes
    # - name: external-secrets
    #   originRevision: "@monorepo"
    #   copy:
    #     - from: "@monorepo/kubernetes/infrastructure/base/external-secrets/external-secrets/**"
    #       to: "@artifact/base/external-secrets"
    #     - from: "@monorepo/kubernetes/infrastructure/desk8s/external-secrets/external-secrets/**"
    #       to: "@artifact/desk8s/external-secrets"
    # old setup including all infrastructure services at once
    - name: infrastructure
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/infrastructure/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/infrastructure/desk8s/**"
          to: "@artifact/desk8s/"
    ### apps
    # old setup including all apps at once
    - name: apps
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/apps/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/apps/desk8s/**"
          to: "@artifact/desk8s/"
