---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  artifacts:
    ### infrastructure
    # old setup including all infrastructure services at once
    - name: infrastructure
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/infrastructure/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/infrastructure/desk8s/**"
          to: "@artifact/desk8s/"
    ### apps
    # podinfo test deployment
    - name: podinfo
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/base/default/podinfo/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/desk8s/default/podinfo/**"
          to: "@artifact/desk8s/"
