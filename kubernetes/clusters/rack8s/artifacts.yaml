---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  artifacts:
    ### infrastructure
    # old setup including all infrastructure services at once
    - name: infrastructure
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/infrastructure/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/infrastructure/rack8s/**"
          to: "@artifact/rack8s/"
    # tuppr & tuppr-upgrades deployment
    - name: tuppr
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/base/system-upgrade/tuppr/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/rack8s/system-upgrade/tuppr/**"
          to: "@artifact/rack8s/"
    # tuppr-upgrades deployment
    - name: tuppr-upgrades
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/base/system-upgrade/tuppr-upgrades/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/rack8s/system-upgrade/tuppr-upgrades/**"
          to: "@artifact/rack8s/"
    ### apps
    # podinfo test deployment
    - name: podinfo
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/kubernetes/base/default/podinfo/**"
          to: "@artifact/base/"
        - from: "@monorepo/kubernetes/rack8s/default/podinfo/**"
          to: "@artifact/rack8s/"
