apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: podinfo
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: podinfo.${cluster_domain}
    external-dns.alpha.kubernetes.io/target: apps.${cluster_domain}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: apps
    namespace: kube-system
  listeners:
    - name: http
      hostname: podinfo.${cluster_domain}
      protocol: HTTP
      port: 80
    - name: https
      hostname: podinfo.${cluster_domain}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: podinfo-hardes-tls
