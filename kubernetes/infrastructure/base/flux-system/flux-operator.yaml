apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app flux-operator-route
  namespace: &ns flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "15m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: services
      namespace: kube-system
      ready: true
  resources:
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gateway-to-flux-operator-web
        namespace: flux-system
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/instance: flux-operator
            app.kubernetes.io/name: flux-operator
        ingress:
          - fromEntities:
              - ingress
              - host
              - remote-node
            toPorts:
              - ports:
                  - port: "9080"
                    protocol: TCP
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: *app
        namespace: *ns
      spec:
        # Secret names are always required.
        secretName: flux-operator-tls
        duration: 504h # 21d
        renewBefore: 168h # 7d
        subject:
          organizations:
            - cert-manager
        # At least one of commonName (possibly through literalSubject), dnsNames, uris, emailAddresses, ipAddresses or otherNames is required.
        dnsNames:
          - flux.${cluster_domain}
        # Issuer references are always required.
        issuerRef:
          name: scaleway-issuer-${cluster_name}
          # We can reference ClusterIssuers by changing the kind here.
          # The default value is Issuer (i.e. a locally namespaced Issuer)
          kind: ClusterIssuer
    - apiVersion: gateway.networking.k8s.io/v1
      kind: ListenerSet
      metadata:
        name: *app
        namespace: *ns
      spec:
        parentRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: services
          namespace: kube-system
        listeners:
          - name: http
            hostname: flux.${cluster_domain}
            protocol: HTTP
            port: 80
          - name: https
            hostname: flux.${cluster_domain}
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: flux-operator-tls
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: *app
        namespace: *ns
      spec:
        hostnames:
          - flux.${cluster_domain}
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: *app
            namespace: *ns
            sectionName: https
        rules:
          - backendRefs:
              - group: ""
                kind: Service
                name: flux-operator
                port: 9080
                weight: 1
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: flux-operator-http-redirect
        namespace: *ns
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: *app
            namespace: *ns
            sectionName: http
        hostnames:
          - flux.${cluster_domain}
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301