apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app spegel
  namespace: &ns kube-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: *app
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: *app
        namespace: *ns
      spec:
        interval: 15m
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        url: oci://ghcr.io/spegel-org/helm-charts/spegel
        ref:
          tag: << inputs.tag >>
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: *app
        namespace: *ns
      spec:
        chartRef:
          kind: OCIRepository
          name: *app
          namespace: *ns
        interval: 1h
        values:
          #    grafanaDashboard:
          #      enabled: true
          #      mode: GrafanaOperator
          #      grafanaOperator:
          #        matchLabels:
          #          dashboards: grafana
          service:
            registry:
              hostPort: 29999
          #    serviceMonitor:
          #      enabled: true
          spegel:
            containerdSock: /run/containerd/containerd.sock
            containerdRegistryConfigPath: /etc/cri/conf.d/hosts
