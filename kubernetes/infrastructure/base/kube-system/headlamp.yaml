apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app headlamp
  namespace: &ns kube-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: internal
      namespace: *ns
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: *app
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: *app
        namespace: *ns
      spec:
        interval: 15m
        url: https://kubernetes-sigs.github.io/headlamp/
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: *app
        namespace: *ns
      spec:
        chart:
          spec:
            chart: headlamp
            version: << inputs.tag >>
            sourceRef:
              kind: HelmRepository
              name: *app
        interval: 1h
        values:
          replicaCount: 2
          httpRoute:
            enabled: true
            parentRefs:
              - name: internal
                namespace: *ns
                sectionName: http
            hostnames:
              - headlamp.<< inputs.zone >>