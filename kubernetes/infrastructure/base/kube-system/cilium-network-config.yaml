apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app cilium-network-config
  namespace: &ns kube-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: cilium
      namespace: *ns
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: *app
  resources:
    - apiVersion: cilium.io/v2alpha1
      kind: CiliumL2AnnouncementPolicy
      metadata:
        name: announce-all
      spec:
        loadBalancerIPs: true
    - apiVersion: cilium.io/v2
      kind: CiliumLoadBalancerIPPool
      metadata:
        name: lb-ip-pool
      spec:
        allowFirstLastIPs: "No"
        blocks:
          - cidr: << inputs.cidr >>
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: services
        namespace: *ns
        annotations:
          external-dns.alpha.kubernetes.io/target: services.${cluster_domain}
      spec:
        allowedListeners:
          namespaces:
            from: All
        gatewayClassName: cilium
        infrastructure:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: services.${cluster_domain}
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            hostname: "*.${cluster_domain}"
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            hostname: "*.${cluster_domain}"
            allowedRoutes:
              namespaces:
                from: All
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: apps
        namespace: *ns
        annotations:
          external-dns.alpha.kubernetes.io/target: apps.${cluster_domain}
      spec:
        allowedListeners:
          namespaces:
            from: All
        gatewayClassName: cilium
        infrastructure:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: apps.${cluster_domain}
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            hostname: "unknown.${cluster_domain}"
            allowedRoutes:
              namespaces:
                from: Same
