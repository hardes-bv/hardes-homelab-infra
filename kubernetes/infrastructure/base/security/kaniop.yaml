apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app kaniop
  namespace: &ns security
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "15m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: cert-manager-issuers
      namespace: cert-manager
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: *app
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: *app
        namespace: *ns
      spec:
        interval: 15m
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        url: oci://ghcr.io/pando85/helm-charts/kaniop
        ref:
          tag: << inputs.tag >>
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: *app
        namespace: *ns
      spec:
        chartRef:
          kind: OCIRepository
          name: *app
          namespace: *ns
        interval: 1h
        values:
          webhook:
            enabled: true
            certManager:
              enabled: true
              issuerRef:
                name: scaleway-issuer-${cluster_name}
                kind: ClusterIssuer
      #    leaderElect: true
      #   serviceMonitor:
      #     enabled: true
      #    grafanaDashboard:
      #      enabled: true
      #    webhook:
      #      replicaCount: 2