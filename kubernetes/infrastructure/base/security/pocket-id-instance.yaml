apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app pocket-id-instance
  namespace: &ns security
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "15m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      # Needs External Secrets Operator deployed before issuing a `Password` or `ExternalSecret` resource
      name: external-secrets
      namespace: external-secrets
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      # Needs cert-manager deployed before issuing a `Certificate` resource
      name: cert-manager
      namespace: cert-manager
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      # Needs the deployed `Gateway` resources
      name: cilium-network-config
      namespace: kube-system
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      # Needs the deployed PostgreSQL database
      name: pocket-id-db
      namespace: *ns
#  inputsFrom:
#    - apiVersion: fluxcd.controlplane.io/v1
#      kind: ResourceSetInputProvider
#      name: *app
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: &key pocket-id-masterkey
        namespace: *ns
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-sdk-hardes
        target:
          name: *key
          template:
            data:
              masterkey: "{{ .password }}"
        dataFrom:
          - extract:
              key: *key
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: *app
        namespace: *ns
      spec:
        secretName: pocket-id-tls-cert
        duration: 504h # 21d
        renewBefore: 168h # 7d
        subject:
          organizations:
            - cert-manager
        dnsNames:
          - auth.${cluster_domain}
        issuerRef:
          name: scaleway-issuer-${cluster_name}
          kind: ClusterIssuer
    - apiVersion: gateway.networking.k8s.io/v1
      kind: ListenerSet
      metadata:
        name: *app
        namespace: *ns
      spec:
        parentRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: services
          namespace: kube-system
        listeners:
          - name: http
            hostname: auth.${cluster_domain}
            protocol: HTTP
            port: 80
          - name: https
            hostname: auth.${cluster_domain}
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: pocket-id-tls-cert
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pocket-id-instance-http-redirect
        namespace: *ns
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: *app
            namespace: *ns
            sectionName: http
        hostnames:
          - auth.${cluster_domain}
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
    - apiVersion: pocketid.internal/v1alpha1
      kind: PocketIDInstance
      metadata:
        name: *app
        namespace: *ns
      spec:
        encryptionKey:
          valueFrom:
            secretKeyRef:
              name: pocket-id-masterkey
              key: masterkey
        appUrl: "https://auth.${cluster_domain}"
        databaseUrl:
          valueFrom:
            secretKeyRef:
              name: pocket-id-db-app
              key: fqdn-uri
        fileBackend: database
        #  smtp:
        #    host: "smtp.example.com"
        #    port: 587
        #    from: "noreply@example.com"
        #    user: "smtpuser"
        #    password:
        #      valueFrom:
        #        secretKeyRef:
        #          name: smtp-creds
        #          key: password
        #    tls: "starttls"
        #  emailNotifications:
        #    loginNotification: true
        #    oneTimeAccessAsAdmin: true
        #    apiKeyExpiration: true
        #    verification: true
        ui:
          appName: "Hardes SSO"
          homePageUrl: "/settings/account"
          sessionDuration: 1440
          accentColor: "#3b82f6"
        userManagement:
          allowOwnAccountEdit: true
          allowUserSignups: "disabled"
        logging:
          level: "info"
          json: true
        metrics:
          enabled: false
        versionCheckDisabled: true
        auditLogRetentionDays: 30
        timezone: "Europe/Brussels"
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pocket-id-instance-https
        namespace: *ns
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: *app
            namespace: *ns
            sectionName: https
        hostnames:
          - auth.${cluster_domain}
        rules:
          - backendRefs:
              - kind: Service
                name: *app
                port: 1411
