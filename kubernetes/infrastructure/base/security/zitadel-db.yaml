apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app zitadel-db
  namespace: &ns security
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "15m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      # Needs cloudnative-pg operator deployed before issuing a `Cluster` resource
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      # Needs the deployed `StorageClass` resource named `longhorn-local`
      name: longhorn-local
  resources:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: *app
        namespace: *ns
      spec:
        instances: 3
        bootstrap:
          initdb:
            database: zitadel
            owner: zitadel
        enableSuperuserAccess: true
        storage:
          storageClass: longhorn-local
          size: 3Gi
