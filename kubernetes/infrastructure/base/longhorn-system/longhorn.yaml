apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: &app longhorn
  namespace: &ns longhorn-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "15m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: cert-manager
      namespace: cert-manager
      ready: true
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: *app
  resources:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: *app
        namespace: *ns
      spec:
        # Secret names are always required.
        secretName: longhorn-tls

        duration: 504h # 21d
        renewBefore: 168h # 7d

        subject:
          organizations:
            - cert-manager

        # At least one of commonName (possibly through literalSubject), dnsNames, uris, emailAddresses, ipAddresses or otherNames is required.
        dnsNames:
          - longhorn.${cluster_domain}

        # Issuer references are always required.
        issuerRef:
          name: scaleway-issuer-${cluster_name}
          # We can reference ClusterIssuers by changing the kind here.
          # The default value is Issuer (i.e. a locally namespaced Issuer)
          kind: ClusterIssuer
    - apiVersion: gateway.networking.k8s.io/v1
      kind: ListenerSet
      metadata:
        name: *app
        namespace: *ns
      spec:
        parentRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: services
          namespace: kube-system
        listeners:
          - name: http
            hostname: longhorn.${cluster_domain}
            protocol: HTTP
            port: 80
          - name: https
            hostname: longhorn.${cluster_domain}
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: longhorn-tls
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: *app
        namespace: *ns
      spec:
        interval: 15m
        url: https://charts.longhorn.io
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: *app
        namespace: *ns
      spec:
        chart:
          spec:
            chart: longhorn
            version: << inputs.tag >>
            sourceRef:
              kind: HelmRepository
              name: *app
              namespace: *ns
        interval: 1h
        values:
          defaultSettings:
            deletingConfirmationFlag: true
            v1DataEngine: false
            v2DataEngine: true
          persistence:
            dataEngine: "v2"
            defaultFsType: "xfs"
          httproute:
            enabled: true
            hostnames:
              - longhorn.${cluster_domain}
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: ListenerSet
                name: *app
                namespace: *ns
                sectionName: https
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: longhorn-http-redirect
        namespace: *ns
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: *app
            namespace: *ns
            sectionName: http
        hostnames:
          - longhorn.${cluster_domain}
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301