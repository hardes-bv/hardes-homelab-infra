---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-tuppr-healthchecks
  namespace: longhorn-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: infrastructure
  path: ./desk8s
  prune: true
  patches:
    - patch: |-
        - op: add
           path: /spec/healthChecks
           value:
            apiVersion: apps/v1
            kind: DaemonSet
            name: longhorn-manager
            namespace: longhorn-system
            expr: status.desiredNumberScheduled == status.numberReady
      target:
        kind: TalosUpgrade
        group: tuppr.home-operations.com
        version: v1alpha1
        name: talos
