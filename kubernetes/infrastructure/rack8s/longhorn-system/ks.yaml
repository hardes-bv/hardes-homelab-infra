---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: infrastructure
    namespace: flux-system
  path: ./rack8s/longhorn-system
  prune: true
  wait: true
  postBuild:
    substituteStrategy: Always
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
