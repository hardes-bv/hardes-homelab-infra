---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - kube-system/gateway-api-inputs.yaml
  - kube-system/cilium-inputs.yaml
  - kube-system/cilium-network-config-inputs.yaml
  - kube-system/headlamp-inputs.yaml
  - kube-system/spegel-inputs.yaml
  - cert-manager/cert-manager-inputs.yaml
  - cert-manager/scaleway-webhook-inputs.yaml
  - cert-manager/issuers-inputs.yaml
  - network/unifi-dns-inputs.yaml
  - system-upgrade/tuppr-inputs.yaml
  - system-upgrade/tuppr-upgrade-inputs.yaml

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: external-secrets
    path: external-secrets/external-secrets-app-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: onepassword-sdk-hardes
    path: external-secrets/onepassword-sdk-hardes-app-patch.yaml
