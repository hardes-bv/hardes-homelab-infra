---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: tuppr
    path: system-upgrade/tuppr-app-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: tuppr-upgrades
    path: system-upgrade/tuppr-upgrades-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: cilium
    path: kube-system/cilium-app-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: cilium-networking
    path: kube-system/cilium-networking-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: spegel
    path: kube-system/spegel-app-patch.yaml
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: external-secrets
    path: external-secrets/external-secrets-app-patch.yaml
