---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr-upgrades
  namespace: system-upgrade
spec:
  dependsOn:
    - name: tuppr
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: *app
    namespace: flux-system
  path: ./rack8s
  prune: true
  wait: true
