---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      group: tuppr.home-operations.com
      version: v1alpha1
      kind: TalosUpgrade
      name: talos
    path: talos-upgrade-version.yaml
  - target:
      group: tuppr.home-operations.com
      version: v1alpha1
      kind: KubernetesUpgrade
      name: kubernetes
    path: kubernetes-upgrade-version.yaml
