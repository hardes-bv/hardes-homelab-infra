---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr
  namespace: system-upgrade
spec:
  interval: 1h
  retryInterval: 2m
  path: ./desk8s
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: *app
    namespace: flux-system
  prune: true
  wait: true
