apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
# Migrated from the deprecated `cluster.secretboxEncryptionSecret` field.
# The key name `key2` matches what the legacy v1alpha1 field rendered, so existing
# encrypted secrets keep decrypting.
config:
  resources:
    - providers:
        - secretbox:
            keys:
              - name: key2
                secret: DzCkM/V26B63N2k39SjL7ZiiTTJQaz9SCFKIdohCocA=
          resources:
            - secrets
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# Migrated from the deprecated `cluster.apiServer` fields.
image: registry.k8s.io/kube-apiserver:v1.36.4
certExtraSANs: # renamed from `cluster.apiServer.certSANs`
  - 172.16.30.11
# `disablePodSecurityPolicy` has no v1.14 equivalent (PodSecurityPolicy was removed from Kubernetes).
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
# Migrated from `cluster.apiServer.admissionControl`.
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  defaults:
    audit: restricted
    audit-version: latest
    enforce: baseline
    enforce-version: latest
    warn: restricted
    warn-version: latest
  exemptions:
    namespaces:
      - kube-system
    runtimeClasses: []
    usernames: []
  kind: PodSecurityConfiguration
---
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
# Migrated from `cluster.apiServer.auditPolicy`.
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    - level: Metadata
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
# Migrated from the deprecated `cluster.controllerManager` field.
image: registry.k8s.io/kube-controller-manager:v1.36.4
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
# Migrated from the deprecated `cluster.scheduler` field.
image: registry.k8s.io/kube-scheduler:v1.36.4
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
# The v1alpha1 `cluster.apiServer` implicitly used these defaults; the new
# documents must state them explicitly (anonymous access for health endpoints
# only, service-account JWT auth comes from KubeServiceAccountConfig).
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt: []
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
# Was the implicit v1alpha1 default `--authorization-mode=Node,RBAC`; without
# these documents kube-apiserver refuses to start ("at least one authorization
# mode must be defined").
name: node
type: Node
---
apiVersion: v1alpha1
kind: KubeAuthorizerConfig
name: rbac
type: RBAC
